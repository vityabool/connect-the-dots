name: Proposal or idea
description: Suggest a new feature or an improvement
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. This is a free project provided **as is, without support or warranty**, and it is maintained when time allows. A proposal may stay open for a long time, may be declined, or may never be built. A reply is **not guaranteed**.

        If you would like to build it yourself, please say so here **before** you start, so that we can tell you whether it fits (see [CONTRIBUTING.md](https://github.com/vityabool/connect-the-dots/blob/main/CONTRIBUTING.md)). Issues are public: no personal data please.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no similar proposal.
          required: true
        - label: This proposal contains no personal data or secrets.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation (for example "as a facilitator I want ...") rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "No, I am only suggesting it"
        - "Yes, I would send a pull request"
        - "Maybe, with some guidance"
    validations:
      required: true
