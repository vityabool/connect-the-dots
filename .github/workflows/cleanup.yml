name: Data retention cleanup

# Runs the daily data-minimisation job of the app: games are deleted 30 days after they expired, old
# rate-limit counters and orphaned index rows are removed. See docs/OPERATIONS.md and the privacy policy.
on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete expired data
    runs-on: ubuntu-latest
    steps:
      - name: Call the cleanup endpoint
        env:
          SITE_URL: ${{ vars.SWA_URL }}
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CLEANUP_TOKEN" ]; then
            echo "SWA_URL variable or CLEANUP_TOKEN secret is not set" >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST -H "x-cleanup-token: $CLEANUP_TOKEN" "$SITE_URL/api/maintenance/cleanup")
          echo "HTTP $status"
          cat response.json
          echo
          [ "$status" = "200" ]
